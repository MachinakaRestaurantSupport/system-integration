schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  このリポジトリは MachinakaRestaurantSupportTools 全体システムの管理拠点。仕様書は USDM (Universal Specification Describing Manner) 形式の Markdown。
  - 仕様の正本は `usdm/` 配下:
    - 全体: `usdm/machinaka_restaurant_support_tools/`（コンポーネント名 MachinakaRestaurantSupportTools）
    - サブシステム8件: `usdm/accounting_management/`, `usdm/dine_in_ordering/`, `usdm/guest_management/`, `usdm/menu_management/`, `usdm/order_management/`, `usdm/product_management/`, `usdm/sales_management/`, `usdm/takeout_ordering/`
  - 全体システム設計は `docs/system-design.md`。連携ポイント（結合試験の範囲、I-1〜）とテスト戦略をこの文書で管理する。
  - USDM の記法（上位要求 / 下位要求 / 理由 / 説明 / 仕様テーブル）は `../md2usdm/MANUAL.md`、完成例は `../md2usdm/examples/` を参照。
  - Python 仮想環境はリポジトリルート側の `../.venv`。仕様 Markdown を更新したら必ず `../.venv/bin/md2usdm usdm/<プロジェクト>` で Excel を再生成する。`.xlsx` は `.gitignore` 登録済みでコミット対象ではない（正本は Markdown のみ）。
  - openspec のタスクの役割: (1) 各サブシステムリポジトリで実施させる実装指示（対象リポジトリ・参照 USDM パス・受け入れ条件を明記）、(2) 各サブシステムの PR（単体試験完了まで）の確認、(3) このリポジトリでの結合試験・総合試験。
  - opsx フロー: propose = 最初にこのリポジトリでブランチ `feature/<change-id>` を作成してからアーティファクト着手 / apply = USDM・全体設計の更新とタスク作成完了 / archive = 各サブシステムの単体試験状況確認 → 結合試験・総合試験 → 完了で GitHub プルリクエスト作成。結合・総合試験が完了するまで main にマージしない。main マージ時はファイル一覧の更新（各サブシステム側の submodule 参照コミット更新）を行う。
  - このフローでは各サブシステムの submodule 参照ブランチが `feature/<change-id>` に切り替えられる。サブシステム PR マージ時に各自 main へ戻される。
  - git commit / push / PR 作成はユーザーの明示的な指示でのみ実行する。

rules:
  specs:
    - 仕様アーティファクトは USDM Markdown 記法で書き、対象に応じて `usdm/` の9プロジェクトのいずれかに反映する（全体とサブシステム8件）
    - サブシステムの仕様変更時は、全体 USDM と `docs/system-design.md`（連携ポイント・非機能要件）との整合も確認する
    - 仕様 Markdown の追加・更新後は必ず `../.venv/bin/md2usdm usdm/<プロジェクト>` で Excel を生成する
    - ワークフロー中に git commit を実行しない
  tasks:
    - タスクは「サブシステムへの委譲指示」「サブシステム成果物の確認（実装〜単体試験）」「このリポジトリでの結合試験・総合試験」の3種に区別して書く
    - 委譲指示タスクには対象リポジトリ、参照 USDM パス（サブシステム側の `reference/system-integration/usdm/<プロジェクト>/`）、完了条件（単体試験まで）を明記する

operations:
  apply:
    guidance:
      - USDM Markdown を変更した場合は md2usdm で該当プロジェクトの Excel を再生成する
      - git commit は実行しない
      - 結合試験・総合試験タスクが完了したら、GitHub プルリクエスト作成を提案する（実行はユーザーの明示的指示後）
  archive:
    guidance:
      - アーカイブ前に各サブシステムの単体試験状況（PR の状態）を確認し、その後このリポジトリで結合試験・総合試験を実施する
      - メイン仕様を `usdm/` の該当プロジェクトに反映した後は md2usdm で Excel を再生成する
      - git commit は実行しない
