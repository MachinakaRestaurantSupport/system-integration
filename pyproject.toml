[project]
name = "system-integration"
version = "0.1.0"
description = "Integration and E2E tests for MachinakaRestaurantSupportTools"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../product-management/src",
    "../menu-management/src",
    "../guest-management/src",
    "../order-management/src",
    "../dine-in-ordering/src",
    "../takeout-ordering/src",
    "../accounting-management/src",
    "../sales-management/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
